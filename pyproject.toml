[project]
name = "ha-prezero-bielsko"
version = "1.0.0"
description = "Home Assistant integration for the PreZero Bielsko-Biała waste collection schedule"
requires-python = ">=3.13"
license = "MIT"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.coverage.run]
source = ["custom_components.prezero_bielsko"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_also = ["if TYPE_CHECKING:", "raise NotImplementedError"]

[tool.ruff]
target-version = "py313"
line-length = 88

[tool.ruff.lint]
select = [
  "A", "ASYNC", "B", "BLE", "C4", "D", "DTZ", "E", "F", "FLY", "G", "I", "ISC",
  "LOG", "N", "PERF", "PGH", "PIE", "PL", "PT", "PTH", "RET", "RSE", "RUF", "S",
  "SIM", "SLF", "T20", "TC", "TID", "TRY", "UP", "W",
]
ignore = [
  "D202", "D203", "D213", "E501", "PLR0911", "PLR0912", "PLR0913", "PLR0915",
  "PLR2004", "TRY003", "TC001", "TC002", "TC003", "ISC001",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "SLF001", "D103", "PLC0415", "PLR0917"]
"tests_live/**" = ["S101"]

[tool.ruff.lint.isort]
force-sort-within-sections = true
known-first-party = ["custom_components.prezero_bielsko"]
combine-as-imports = true
split-on-trailing-comma = false

[tool.mypy]
python_version = "3.14"
strict = true
ignore_missing_imports = true
# Home Assistant does not re-export everything explicitly.
implicit_reexport = true

# Home Assistant 2026.10+ aliases voluptuous to probatio at runtime.
[[tool.mypy.overrides]]
module = ["voluptuous", "voluptuous.*"]
follow_imports = "skip"

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
disallow_incomplete_defs = false
